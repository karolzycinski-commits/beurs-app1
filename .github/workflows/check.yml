name: 6-Uurlijkse Cross Check

on:
  schedule:
    # Draait om 00:00, 06:00, 12:00 en 18:00 UTC op werkdagen (1-5 = ma t/m vr)
    - cron: '0 */6 * * 1-5'
  workflow_dispatch: # Zorgt ervoor dat je de check ook handmatig kunt starten

jobs:
  check-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Controleer watchlist op kruisingen
        run: |
          curl -X POST "https://beurs-backend.onrender.com/api/controleer-crosses" \
               -H "Content-Type: application/json" \
               -d '{"tickers": ["JEDI.DE", "SPY", "AAPL", "MSFT"]}'
